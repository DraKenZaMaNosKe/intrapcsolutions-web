<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>Área Privada — Orbix Studio</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0B0B10; color: #E5E5EA;
    font-family: -apple-system, system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 40px;
    -webkit-font-smoothing: antialiased;
  }
  .container {
    max-width: 480px; width: 100%; text-align: center;
  }
  .lock {
    width: 64px; height: 64px; margin: 0 auto 24px;
    background: linear-gradient(135deg, #0A84FF 0%, #0066CC 100%);
    border-radius: 16px; display: flex; align-items: center;
    justify-content: center; font-size: 28px;
    box-shadow: 0 8px 24px rgba(10,132,255,0.3);
  }
  h1 {
    font-size: 28px; font-weight: 600; letter-spacing: -0.02em;
    margin-bottom: 12px; color: #fff;
  }
  p {
    font-size: 14px; color: #86868B; line-height: 1.6;
    margin-bottom: 32px;
  }
  .links {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 32px;
  }
  .link {
    display: block; padding: 16px 20px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; color: #fff;
    text-decoration: none; font-size: 14px;
    transition: all 0.2s ease;
    text-align: left;
  }
  .link:hover {
    background: rgba(10,132,255,0.1);
    border-color: #0A84FF;
    transform: translateY(-1px);
  }
  .link strong { display: block; margin-bottom: 4px; color: #fff; }
  .link span { color: #86868B; font-size: 12px; }
  .footer {
    font-size: 11px; color: #6E6E73; letter-spacing: 0.06em;
    text-transform: uppercase; font-family: monospace;
  }
  .footer a { color: #0A84FF; text-decoration: none; }
</style>
</head>
<body>
  <div class="container">
    <div class="lock">🔒</div>
    <h1>Área Privada</h1>
    <p>
      Acceso restringido para administradores de Orbix Studio.<br>
      Si llegaste aquí por error, regresa al
      <a href="/" style="color:#0A84FF">sitio principal</a>.
    </p>
    <div class="links">
      <a class="link" href="/privado/master/">
        <strong>📄 Documento Maestro</strong>
        <span>Pixora IA · Orbix Studio · estrategia y operación</span>
      </a>
    </div>
    <div class="footer">
      Orbix Studio · <a href="/">intrapcsolutions.com</a>
    </div>
  </div>
</body>
</html>
